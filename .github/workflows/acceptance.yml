# The acceptance run, on demand (Part B §63, §64, §65).
#
# `ci.yml` proves the code works. This proves the *claims* hold: §65's six scientific levels, each
# beside its own negative control, in one campaign under one manifest. It is a separate workflow
# because it takes about an hour and because its output is evidence rather than a pass/fail —
# `m13_acceptance.json` is uploaded as an artifact so a reader can check the gates themselves.
#
# Run it from the Actions tab, or on a schedule to catch a claim that quietly stops holding.

name: acceptance

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Which §65 levels to run (comma-separated, blank for all six)"
        required: false
        default: ""
      seeds:
        description: "Seeds"
        required: false
        default: "0,1,2,3,4"
      passes:
        description: "Accumulation passes"
        required: false
        default: "3"
  schedule:
    # Weekly. A result that silently stops holding is worse than one that never held, because
    # nobody goes looking for it.
    - cron: "17 4 * * 1"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}

      - run: pip install -e ".[dev]"

      - name: What is actually in force
        # Printed before the run, not after: the manifest records the sandbox backend and the
        # limits it cannot enforce, and a reader needs those to know what the numbers mean.
        # `|| true` because a CI runner is not a production deployment and is not expected to
        # pass §64 — the point is that the gap is visible, not that it is absent.
        run: |
          export CIVITAS_DATABASE_URL="sqlite:///$RUNNER_TEMP/acceptance.db"
          export CIVITAS_JWT_SECRET=ci-acceptance-not-a-real-key
          python -m civitas.cli preflight || true

      - name: Run the six levels
        id: run
        run: |
          export CIVITAS_DATABASE_URL="sqlite:///$RUNNER_TEMP/acceptance.db"
          export CIVITAS_JWT_SECRET=ci-acceptance-not-a-real-key
          python -m civitas.cli init-db --alembic
          LEVELS=""
          if [ -n "${{ inputs.levels }}" ]; then LEVELS="--levels ${{ inputs.levels }}"; fi
          python -m civitas.cli acceptance \
            --seeds "${{ inputs.seeds || '0,1,2,3,4' }}" \
            --passes "${{ inputs.passes || '3' }}" \
            $LEVELS \
            --out acceptance.json

      - name: Write the result into the job summary
        # A JSON artifact nobody opens is a result nobody reads. The table lands on the run page.
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("acceptance.json")
          if not path.exists():
              print("## Acceptance\n\nThe run produced no result file.")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print("## Acceptance —", "**accepted**" if report["accepted"] else "**NOT accepted**")
          print()
          print("| | level | value | control | gates |")
          print("|---|---|---|---|---|")
          for level in report["levels"]:
              mark = "PASS" if level["passed"] else "FAIL"
              value = "withheld" if level["value"] is None else level["value"]
              gates = ", ".join(
                  f"{'ok' if g['passed'] else 'FAILED'} {n}" for n, g in level["gates"].items()
              )
              print(f"| {mark} | {level['level']} {level['name']} | {value} "
                    f"| {level['control_value']} | {gates} |")
          m = report["manifest"]
          print()
          print(f"Code `{m['code_version']}` · schema `{m['schema_version']}` · "
                f"seeds {m['seeds']} · {m['accumulation_passes']} accumulation passes")
          print()
          sandbox = m["sandbox"]
          unenforced = m["sandbox_unenforced_limits"]
          print(f"Sandbox: **{sandbox['backend']}**, isolation **{sandbox['isolation_level']}**.")
          if unenforced:
              print(f"Limits this backend could **not** enforce here: `{unenforced}` — "
                    f"a result produced under weaker isolation must not be mistaken for one "
                    f"produced under the real thing.")
          for level in report["levels"]:
              if level["withheld_reason"]:
                  print(f"\n> Level {level['level']} withheld: {level['withheld_reason']}")
          PY

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ github.run_number }}
          path: acceptance.json
          if-no-files-found: warn

# CI (Part B §56).
#
# The two-backend run is the point. §6 forbids separate application logic for Colab, and the only
# way to know that holds is to run the same tests on both dialects — M2 found a concurrency race
# in the event-sequence allocator that SQLite structurally cannot expose. A pipeline that ran
# SQLite alone would have shipped it.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install ruff
      - run: ruff check civitas tests scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civitas
          POSTGRES_PASSWORD: civitas
          POSTGRES_DB: civitas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civitas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,postgres]"
      - name: Test on both backends
        env:
          CIVITAS_TEST_POSTGRES_URL: postgresql+psycopg://civitas:civitas@127.0.0.1:5432/civitas_test
        run: pytest -q

  migrations:
    # A schema built by `metadata.create_all` and one built by migrations must be the same schema.
    # They drift silently — a column added to a model without a migration works in every test that
    # uses `create_all` and fails on the first production deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Migrations reach head and match the models
        run: |
          export CIVITAS_DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db"
          export CIVITAS_JWT_SECRET=ci-not-a-real-key
          alembic upgrade head
          python -m pytest tests/test_migrations.py -q

  ui:
    # The browser tests found four defects the API tests structurally could not, because they
    # issue one request at a time. Kept as its own job so a missing browser is a visible skip
    # rather than a silent hole in the other job's count.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,ui-tests]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/test_web_ui.py -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          push: false
          load: true
          tags: civitas:ci
      - name: The image runs as a non-root user
        # Not a formality: `RLIMIT_NPROC` is silently not enforced for uid 0 — measured in M4,
        # where a "fork bomb" test spawned 5000 processes against a limit of 8. An image that ran
        # as root would report sandbox limits it does not hold.
        run: |
          test "$(docker run --rm civitas:ci id -u)" != "0"
          docker run --rm civitas:ci civitas domains > /dev/null
